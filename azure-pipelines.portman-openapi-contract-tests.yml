# -----------------------------------------------------------------------------
# Illustration: Azure Pipelines equivalent of .github/workflows/openapi-portman.yml
#
# This file is not wired to Azure DevOps by default. In ADO: Pipelines → New
# pipeline → select this repo → Existing Azure Pipelines YAML file → choose
# azure-pipelines.portman-openapi-contract-tests.yml
#
# Map GitHub Actions → Azure DevOps
#   secrets.POSTMAN_API_KEY     → Pipeline variable POSTMAN_API_KEY (secret)
#   vars.PORTMAN_BASE_URL       → Variable PORTMAN_BASE_URL (optional)
#   vars.PORTMAN_GENERATED_COLLECTION_UID → PORTMAN_GENERATED_COLLECTION_UID (optional)
#   vars.PORTMAN_ENVIRONMENT_ID → PORTMAN_ENVIRONMENT_ID (optional)
#   GITHUB_WORKSPACE            → $(Build.SourcesDirectory)
#   pull_request                → eq(variables['Build.Reason'], 'PullRequest')
#   push to main                → main branch CI (not PullRequest) on refs/heads/main
#
# Pull requests: Portman writes artifacts/openapi-contract-tests.postman.json only;
#   Postman CLI runs that file with the mock environment YAML path.
# Main: Portman syncs to Postman Cloud (--syncPostman); Postman CLI runs by collection UID
#   with environment UID and cli + json + junit reporters.
#
# Optional: replace inline variables with a variable group, e.g.
#   variables:
#     - group: postman-portman
# -----------------------------------------------------------------------------
name: OpenAPI Portman Contract Tests

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  LOCAL_ENVIRONMENT: "postman/environments/LED Display Mock Environment.environment.yaml"
  # Override in Pipeline settings or a variable group; empty values use script defaults.
  PORTMAN_BASE_URL: ""
  PORTMAN_GENERATED_COLLECTION_UID: ""
  PORTMAN_ENVIRONMENT_ID: ""

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    displayName: Checkout repository

  - task: NodeTool@0
    displayName: Use Node.js 20
    inputs:
      versionSpec: "20.x"

  - bash: |
      set -euo pipefail
      mkdir -p artifacts
      BASE="${PORTMAN_BASE_URL:-https://16d7e73f-15b8-4fb0-87c4-fe02baff587a.mock.pstmn.io}"
      npx --yes -p @apideck/portman@1.34.0 -p tslib portman \
        -l final-led-display-api.yaml \
        -o artifacts/openapi-contract-tests.postman.json \
        -b "${BASE}"
    displayName: Portman — generate contract collection (local, PR)
    condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
    env:
      PORTMAN_BASE_URL: $(PORTMAN_BASE_URL)

  - bash: |
      set -euo pipefail
      test -n "${POSTMAN_API_KEY}" || { echo "POSTMAN_API_KEY variable (secret) is required on main."; exit 1; }
      mkdir -p artifacts
      COL_UID="${PORTMAN_GENERATED_COLLECTION_UID:-50602431-d65b1bd9-42d8-46ed-8385-4bda3f86cadd}"
      BASE="${PORTMAN_BASE_URL:-https://16d7e73f-15b8-4fb0-87c4-fe02baff587a.mock.pstmn.io}"
      export POSTMAN_API_KEY
      npx --yes -p @apideck/portman@1.34.0 -p tslib portman \
        -l final-led-display-api.yaml \
        -o artifacts/openapi-contract-tests.postman.json \
        -b "${BASE}" \
        --syncPostman \
        -p "${COL_UID}" \
        --collectionName "Portman Generated Contract Test"
    displayName: Portman — generate, sync to Postman Cloud (main)
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    env:
      POSTMAN_API_KEY: $(POSTMAN_API_KEY)
      PORTMAN_BASE_URL: $(PORTMAN_BASE_URL)
      PORTMAN_GENERATED_COLLECTION_UID: $(PORTMAN_GENERATED_COLLECTION_UID)

  - task: PublishPipelineArtifact@1
    displayName: Publish openapi-contract-tests Postman collection
    condition: succeeded()
    inputs:
      targetPath: "$(Build.SourcesDirectory)/artifacts/openapi-contract-tests.postman.json"
      artifact: openapi-contract-tests-postman-collection

  - bash: |
      set -euo pipefail
      curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
      echo "##vso[task.prependpath]$HOME/.postman-cli/bin"
    displayName: Install Postman CLI

  - bash: |
      set -euo pipefail
      postman --version
    displayName: Verify Postman CLI

  - bash: |
      set -euo pipefail
      test -n "${POSTMAN_API_KEY}" || { echo "POSTMAN_API_KEY is required for Postman CLI login."; exit 1; }
      postman login --with-api-key "${POSTMAN_API_KEY}"
    displayName: Postman CLI — log in
    env:
      POSTMAN_API_KEY: $(POSTMAN_API_KEY)

  - bash: |
      set -euo pipefail
      postman collection run "artifacts/openapi-contract-tests.postman.json" \
        --environment "${LOCAL_ENVIRONMENT}" \
        --working-dir "$(Build.SourcesDirectory)" \
        --report-events
    displayName: Postman CLI — run local collection (PR)
    condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
    env:
      POSTMAN_API_KEY: $(POSTMAN_API_KEY)
      LOCAL_ENVIRONMENT: $(LOCAL_ENVIRONMENT)

  - bash: |
      set -euo pipefail
      mkdir -p artifacts
      COL_UID="${PORTMAN_GENERATED_COLLECTION_UID:-50602431-d65b1bd9-42d8-46ed-8385-4bda3f86cadd}"
      ENV_UID="${PORTMAN_ENVIRONMENT_ID:-41094746-b57f7bf6-e6ed-4568-86c2-bd6df6cfd3c4}"
      echo "Collection UID: ${COL_UID}"
      echo "Environment UID: ${ENV_UID}"
      postman collection run "${COL_UID}" \
        --environment "${ENV_UID}" \
        --working-dir "$(Build.SourcesDirectory)" \
        --report-events \
        -r cli,json,junit \
        --reporter-json-export artifacts/openapi-contract-tests-cloud.json \
        --reporter-junit-export artifacts/openapi-contract-tests-cloud.xml
    displayName: Postman CLI — run cloud collection by UID (main)
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    env:
      POSTMAN_API_KEY: $(POSTMAN_API_KEY)
      PORTMAN_GENERATED_COLLECTION_UID: $(PORTMAN_GENERATED_COLLECTION_UID)
      PORTMAN_ENVIRONMENT_ID: $(PORTMAN_ENVIRONMENT_ID)

  - task: PublishTestResults@2
    displayName: Publish JUnit results (Portman Cloud run)
    condition: and(succeededOrFailed(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: "$(Build.SourcesDirectory)/artifacts/openapi-contract-tests-cloud.xml"
      testRunTitle: "OpenAPI Portman Contract Tests (Postman Cloud)"
      failTaskOnFailedTests: true

  - task: PublishPipelineArtifact@1
    displayName: Publish Postman reports (Portman Cloud run)
    condition: and(succeededOrFailed(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    inputs:
      targetPath: "$(Build.SourcesDirectory)/artifacts"
      artifact: openapi-portman-postman-reports-cloud
