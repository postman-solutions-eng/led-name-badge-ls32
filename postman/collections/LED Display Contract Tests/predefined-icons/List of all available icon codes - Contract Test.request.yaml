$kind: http-request
url: "{{baseUrl}}/predefined-icons"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: >-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });


      pm.test("Response has correct content type", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });


      pm.test("Response contains icons array", function () {
          const responseJson = pm.response.json();
          pm.expect(responseJson).to.have.property("icons");
          pm.expect(responseJson.icons).to.be.an("array");
          pm.expect(responseJson.icons.length).to.be.greaterThan(0);
      });


      pm.test("Icons are in correct format", function () {
          const responseJson = pm.response.json();
          responseJson.icons.forEach(function(icon) {
              pm.expect(icon).to.match(/^:.+:$/);
          });
      });
    language: text/javascript
order: 1000
