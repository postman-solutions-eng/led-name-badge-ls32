$kind: http-example
request:
  url: "{{baseUrl}}/predefined-icons"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: X-API-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "text": "Hello World!"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "error": "string",
        "details": "string"
      }
order: 2000
