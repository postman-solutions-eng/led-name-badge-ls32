$kind: http-example
name: Multiple icons with no spaces
request:
  url: "{{baseUrl}}/display-text"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: '{"text": ":heart::smile::star::ball::sun:"}'
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: '{"success": true, "message": "Text displayed successfully", "text": ":heart::smile::star::ball::sun:"}'
order: 86000
