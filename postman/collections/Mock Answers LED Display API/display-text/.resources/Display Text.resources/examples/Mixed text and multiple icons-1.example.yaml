$kind: http-example
name: Mixed text and multiple icons
request:
  url: "{{baseUrl}}/display-text"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: '{"text": "Hello :heart: World :smile: Everyone"}'
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: '{"success": true, "message": "Text displayed successfully", "text": "Hello :heart: World :smile: Everyone"}'
order: 79000
