$kind: http-example
name: Error - Unicode Heart Emoji
request:
  url: "{{baseUrl}}/display-text"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: '{"text": "I ❤️ you"}'
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: '{"success": false, "error": "Unicode emoji not supported. Please use icon codes like :heart: instead."}'
order: 66000
