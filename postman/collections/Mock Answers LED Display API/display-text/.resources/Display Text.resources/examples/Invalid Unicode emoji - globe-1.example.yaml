$kind: http-example
name: Invalid Unicode emoji - globe
request:
  url: "{{baseUrl}}/display-text"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: '{"text": "Hello 🌍 World"}'
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: '{"success": false, "error": "Invalid input detected"}'
order: 84000
