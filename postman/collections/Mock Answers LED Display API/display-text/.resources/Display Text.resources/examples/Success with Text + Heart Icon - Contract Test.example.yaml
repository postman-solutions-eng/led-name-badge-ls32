$kind: http-example
request:
  url: '{{baseUrl}}/display-text'
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "text": "Postman :heart: ABB"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
    Server: Werkzeug/3.1.5 Python/3.13.7
    Date: Mon, 28 Apr 2026 08:13:00 GMT
    Content-Length: "62"
    Connection: close
  body:
    type: json
    content: |-
      {
        "status": "Text displayed on LED",
        "text": "Postman :heart: ABB"
      }
order: 1000
