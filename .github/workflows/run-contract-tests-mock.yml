name: LED Display contract tests (mock)

on:
  push:
    branches:
      - '**'

jobs:
  contract-tests-mock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Run contract tests against mock environment
        run: |
          postman collection run "postman/collections/LED Display Contract Tests" \
            --environment "postman/environments/LED Display Mock Environment.environment.yaml" \
            --working-dir "$GITHUB_WORKSPACE" \
            --report-events
