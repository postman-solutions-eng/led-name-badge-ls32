name: Run Postman collections on change

on:
  push:
    paths:
      - 'postman/collections/**'
      - 'postman/environments/**'
  pull_request:
    paths:
      - 'postman/collections/**'
      - 'postman/environments/**'

jobs:
  run-collections:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Run Postman collections
        run: |
          for collection_dir in postman/collections/*/; do
            dir="${collection_dir%/}"
            if [ -f "${dir}/.resources/definition.yaml" ] || [ -f "${dir}/.resources/definition.yml" ]; then
              name=$(basename "$dir")
              echo "Running collection: $name"
              postman collection run "$dir" \
                --environment "postman/environments/LED Display Mock Environment.environment.yaml" \
                --working-dir "$GITHUB_WORKSPACE"
            fi
          done
