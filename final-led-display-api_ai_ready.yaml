openapi: 3.0.0
info:
  title: Final LED Display API (AI-ready)
  version: 1.1.0
  contact:
    name: LED Display API Support
    url: https://github.com/postman-solutions-eng/led-display-demo
    email: support@example.com
  license:
    name: GPL-2.0
  termsOfService: https://github.com/postman-solutions-eng/led-display-demo
  description: >-
    # API for controlling LED name badge displays


    This API allows you to update the text and visual content displayed on LED
    badges, including support for alphanumeric text and predefined icon codes.


    This is the **AI-ready** revision of the LED Display API. Compared to the
    original spec it adds stable `operationId`s, explicit `required` fields,
    per-operation authentication, a machine-readable error envelope on every
    response (no HTML error pages), documents the optional `meta` previews on
    `/predefined-icons`, and marks the conditionally-present `/display-summary`
    fields as nullable.


    ## Supported Icons


    The following icon codes can be embedded in text using the `:icon_name:`
    syntax:


    - `:ball:` - Filled circle

    - `:happy:` - Simple smiley face

    - `:happy2:` - Larger smiley (2 columns wide)

    - `:heart:` - Outline heart

    - `:HEART:` - Filled heart

    - `:heart2:` - Larger outline heart (2 columns wide)

    - `:HEART2:` - Larger filled heart (2 columns wide)

    - `:fablab:` - FabLab logo

    - `:bicycle:` - Bicycle icon (3 columns wide)

    - `:bicycle_r:` - Bicycle facing right (3 columns wide)

    - `:owncloud:` - OwnCloud logo (3 columns wide)

    - `:octocat:` - GitHub Octocat

    - `:smile:` - Smile emoji

    - `:star:` - Star icon

    - `:sun:` - Sun icon


    ## Character Restrictions


    **Supported characters:**


    - Letters: A-Z, a-z

    - Numbers: 0-9

    - Special characters: `^ !"$%&/()=?` °}\]\[{@ \~ |<>,;.:-_#'+_\`

    - German umlauts: äöüÄÖÜß

    - French/European accents: àäòöùüèéêëôöûîïÿçÀÅÄÉÈÊËÖÔÜÛÙŸŠ


    **NOT supported:**


    - Unicode emoji (e.g., 🌍) - will return a 400 error


    **Escape sequences:**


    - `::` - Escapes to a single literal colon


    **Custom images:**


    - Use `:path/to/image.png:` syntax to reference custom images

    - Images must be exactly 11 pixels high


    ## Rate limiting


    Requests are limited to 60 per 60-second window per client. Responses carry
    `X-RateLimit-Limit`, `X-RateLimit-Remaining`, and `X-RateLimit-Reset`
    headers; exceeding the limit returns `429` with a `Retry-After` header.


    ## CORS


    All origins are allowed (`Access-Control-Allow-Origin: *`). Preflight
    `OPTIONS` requests return the allowed methods (`GET, POST, OPTIONS`) and
    headers (`Content-Type, X-API-Key`).
servers:
  - url: http://127.0.0.1:5001
    description: Local development server
  - url: https://led-display.staging.example.com
    description: Staging server (replace with your deployment host)
  - url: https://led-display.example.com
    description: Production server (replace with your deployment host)
tags:
  - name: display
    description: Operations that render text or summaries onto the LED badge
  - name: icons
    description: Discovery of the built-in icon catalog
  - name: health
    description: Service liveness and version probe
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        API key for requests to the LED Display API. On `/display-summary`, when
        set, also used to fetch services from the Postman API Catalog; when
        omitted or empty, the default demo summary is shown.
  headers:
    X-API-Version:
      description: Version of the API that served the response
      schema:
        type: string
        example: 1.1.0
    X-RateLimit-Limit:
      description: Maximum number of requests allowed per 60-second window
      schema:
        type: integer
        example: 60
    X-RateLimit-Remaining:
      description: Requests remaining in the current window
      schema:
        type: integer
        example: 59
    X-RateLimit-Reset:
      description: Seconds until the current rate-limit window resets
      schema:
        type: integer
        example: 60
    Cache-Control:
      description: >-
        Caching policy. Cacheable endpoints (icon list, health) return
        `public, max-age=3600`; display actions and errors return `no-store`.
      schema:
        type: string
        example: public, max-age=3600
  responses:
    TooManyRequests:
      description: Rate limit exceeded. Back off and retry after the indicated delay.
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
            example: 42
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Rate limit exceeded
            details: Too many requests. Retry after 42 seconds.
    BadRequest:
      description: Invalid request or unsupported display string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Invalid display string format
            details: "'🌍'"
    Unauthorized:
      description: Postman API key is invalid or unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Failed to fetch API catalog
            details: 'Postman API catalog request failed (401): unauthorized'
    Forbidden:
      description: >-
        The supplied Postman API key is valid but lacks access to the API
        catalog. The upstream status code is passed through.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource (or API catalog system environment) not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: The HTTP method is not allowed for this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server, hardware, or file error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
        - details
      properties:
        error:
          type: string
          description: Short, human-readable error category
        details:
          type: string
          description: Detailed explanation of what went wrong
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health Check
      tags:
        - health
      description: >-
        Liveness probe. Public, not rate-limited, and cacheable. Returns the
        service status and API version.
      security: []
      responses:
        '200':
          description: Service is healthy
          headers:
            X-API-Version:
              $ref: '#/components/headers/X-API-Version'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - version
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 1.1.0
              example:
                status: ok
                version: 1.1.0
  /display-text:
    post:
      operationId: displayText
      summary: Display Text
      tags:
        - display
      description: >-
        Updates the text and visual content displayed on the LED name badge.
        Accepts text and icon codes in the format `:icon_name:`. The `text`
        field is required and must be a non-empty string.
      security:
        - ApiKeyAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  minLength: 1
                  pattern: '^[\x20-\x7EÀ-ſ]+$'
                  description: >-
                    The text to display, optionally including icon codes in
                    `:icon_name:` format. Required and must be non-empty.
                    Allowed characters: printable ASCII plus Latin-1 / Latin
                    Extended-A letters (umlauts, accents). Unicode emoji and
                    other characters outside these ranges are rejected with 400.
            example:
              text: 'Hello World! :heart:'
      responses:
        '200':
          description: Text displayed successfully
          headers:
            X-API-Version:
              $ref: '#/components/headers/X-API-Version'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - text
                properties:
                  status:
                    type: string
                  text:
                    type: string
              example:
                status: Text displayed on LED
                text: 'Hello World! :heart:'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /predefined-icons:
    get:
      operationId: listPredefinedIcons
      summary: Get Predefined Icons
      tags:
        - icons
      description: >-
        Returns a list of all available icon codes that can be used in display
        text. Icons are returned as string codes in the `:icon_name:` format.


        By default only the `icons` array is returned. Set the `meta` query
        parameter to `true` to additionally receive the `meta` array, which
        contains a rendered base64 PNG preview of each icon. The previews are
        large, so they are opt-in.
      security: []
      parameters:
        - name: meta
          in: query
          required: false
          description: >-
            When true (`true`/`1`/`yes`/`on`), include the `meta` array with a
            rendered PNG preview for each icon. Omitted or false: `meta` is not
            present in the response.
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          description: Maximum number of icons to return (page size).
          schema:
            type: integer
            minimum: 1
            default: 100
        - name: offset
          in: query
          required: false
          description: Number of icons to skip before the returned page.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of all available icon codes (optionally with previews)
          headers:
            X-API-Version:
              $ref: '#/components/headers/X-API-Version'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - total
                  - limit
                  - offset
                  - icons
                properties:
                  status:
                    type: string
                    description: Status of the operation
                  total:
                    type: integer
                    description: Total number of icons available (before paging)
                  limit:
                    type: integer
                    description: Page size applied to this response
                  offset:
                    type: integer
                    description: Number of icons skipped before this page
                  icons:
                    type: array
                    description: Array of icon codes in `:icon_name:` format
                    items:
                      type: string
                  meta:
                    type: array
                    description: >-
                      Present only when `meta=true`. Rendered previews for each
                      icon, in the same order as `icons`.
                    items:
                      type: object
                      required:
                        - name
                        - image
                      properties:
                        name:
                          type: string
                          description: Icon name without the colon delimiters
                        image:
                          type: string
                          format: uri
                          description: >-
                            Base64-encoded PNG data URI of the rendered icon
                            bitmap (e.g. `data:image/png;base64,...`)
              examples:
                iconsOnly:
                  summary: Default response (no meta)
                  value:
                    status: Predefined icons retrieved
                    total: 15
                    limit: 100
                    offset: 0
                    icons:
                      - ':ball:'
                      - ':happy:'
                      - ':heart:'
                      - ':star:'
                      - ':sun:'
                withMeta:
                  summary: Response when meta=true
                  value:
                    status: Predefined icons retrieved
                    total: 15
                    limit: 2
                    offset: 0
                    icons:
                      - ':ball:'
                      - ':happy:'
                    meta:
                      - name: ball
                        image: 'data:image/png;base64,iVBORw0KGgo...'
                      - name: happy
                        image: 'data:image/png;base64,iVBORw0KGgo...'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /display-summary:
    post:
      operationId: displaySummary
      summary: Display Summary
      tags:
        - display
      description: >-
        Displays a summary message on the LED badge.


        Without an API key (`X-API-Key` header or `apiKey` in the body), shows
        the built-in demo summary text. When a key is provided, the endpoint
        fetches services from the [Postman API
        Catalog](https://learning.postman.com/docs/api-catalog/overview) and
        renders a compact health summary on the badge.
      security:
        - ApiKeyAuth: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                apiKey:
                  type: string
                  description: >-
                    Optional alternative to the `X-API-Key` header for supplying
                    a Postman API key (`PMAK-...`) used to fetch the API catalog
                systemEnvironmentId:
                  type: string
                  format: uuid
                  description: >-
                    Optional API catalog system environment ID. When omitted, the
                    first production environment is used, otherwise the first
                    environment with associations, otherwise the first available
                    environment.
            examples:
              defaultSummary:
                summary: Default demo summary
                value: {}
              catalogSummary:
                summary: API catalog summary
                value:
                  systemEnvironmentId: e34d6213-509d-4b61-94da-8b8c093cb925
      responses:
        '200':
          description: Summary message displayed successfully
          headers:
            X-API-Version:
              $ref: '#/components/headers/X-API-Version'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    description: Status of the operation
                  source:
                    type: string
                    nullable: true
                    description: >-
                      Present only when a Postman API key was supplied. Indicates
                      the summary was built from the Postman API catalog.
                    enum:
                      - postman-api-catalog
                  text:
                    type: string
                    nullable: true
                    description: >-
                      Present only in the catalog case. The text rendered on the
                      LED badge.
                  systemEnvironment:
                    type: object
                    nullable: true
                    description: >-
                      Present only in the catalog case. The API catalog system
                      environment used to list services.
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                  serviceCount:
                    type: integer
                    nullable: true
                    description: >-
                      Present only in the catalog case. Number of services in the
                      summary.
                  hasMore:
                    type: boolean
                    nullable: true
                    description: >-
                      Present only in the catalog case. True when additional
                      catalog services exist beyond the fetched page.
                  services:
                    type: array
                    nullable: true
                    description: >-
                      Present only in the catalog case. Catalog services included
                      in the summary.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        status:
                          type: string
                          enum:
                            - healthy
                            - warning
                            - critical
                            - inactive
              examples:
                defaultSummary:
                  summary: Default summary without Postman API key
                  value:
                    status: Summary displayed on LED
                catalogSummary:
                  summary: Summary built from the Postman API catalog
                  value:
                    status: Summary displayed on LED
                    source: postman-api-catalog
                    text: 'Production - 3 svcs (2 ok, 1 warn) :star:'
                    systemEnvironment:
                      id: e34d6213-509d-4b61-94da-8b8c093cb925
                      name: Production
                    serviceCount: 3
                    hasMore: false
                    services:
                      - id: 11111111-1111-1111-1111-111111111111
                        name: payments-api
                        status: healthy
                      - id: 22222222-2222-2222-2222-222222222222
                        name: billing-api
                        status: warning
                      - id: 33333333-3333-3333-3333-333333333333
                        name: users-api
                        status: healthy
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
